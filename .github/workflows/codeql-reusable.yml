# org/security-workflows/.github/workflows/codeql-reusable.yml
#
# OWASP Top 10 2025 coverage (security-extended query suite):
#   A01 – Broken Access Control       (path traversal, LDAP/XPath injection bypass)
#   A04 – Cryptographic Failures      (weak algorithms, insecure RNG, hardcoded secrets)
#   A05 – Injection                   (SQL, command, XSS, path, template, LDAP injection)
#   A07 – Authentication Failures     (hardcoded credentials, weak authentication patterns)
#   A08 – Software/Data Integrity     (unsafe deserialization, unsafe reflection)
#   A10 – Improper Error Handling     (information leakage via exceptions)
#
# Not covered by CodeQL alone — see complementary workflows / notes in README:
#   A02 – Security Misconfiguration   (use IaC scanning: Checkov / Trivy)
#   A03 – Supply Chain Failures       (use dependency-review-reusable.yml + Dependabot)
#   A06 – Insecure Design             (requires threat modelling and architecture review)
#   A09 – Logging & Alerting Failures (runtime monitoring; not detectable via SAST)
name: CodeQL (reusable)
on:
  workflow_call:
    inputs:
      languages:    { type: string, required: true }   # JSON array
      build-mode:   { type: string, default: "none" }
      runner:       { type: string, default: "ubuntu-latest" }
      query-suite:  { type: string, default: "security-extended" }

permissions:
  contents: read
  security-events: write     # upload SARIF
  packages: read

jobs:
  analyze:
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.query-suite }}

      # Manual build example (only when build-mode: manual)
      - name: Build (.NET manual mode)
        if: ${{ inputs.build-mode == 'manual' && matrix.language == 'csharp' }}
        run: dotnet build --configuration Release /p:UseSharedCompilation=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
