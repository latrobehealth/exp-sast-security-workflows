# org/security-workflows/.github/workflows/codeql-reusable.yml
#
# OWASP Top 10:2025 coverage (security-extended query suite):
#   A01 – Broken Access Control       (path traversal, missing access control, IDOR)
#   A02 – Cryptographic Failures      (weak algorithms, hardcoded credentials)
#   A03 – Injection                   (SQL, command, XSS, path, log forging)
#   A05 – Security Misconfiguration   (unvalidated redirect, stack trace exposure)
#   A07 – Authentication Failures     (credential logging, token exposure)
#   A08 – Software/Data Integrity     (XXE via XmlUrlResolver)
#   A09 – Logging Failures            (log injection / forging)
#   A10 – SSRF                        (HttpClient with user-controlled URL)
#
# Not covered by CodeQL alone — see complementary workflows / README:
#   A04 – Insecure Design             (requires threat modelling and architecture review)
#   A06 – Vulnerable Components       (use dependency-review-reusable.yml + Dependabot)
#
# ── SARIF enrichment ──────────────────────────────────────────────────────────
# The analyze job saves SARIF locally, runs enrich-sarif-owasp.py to inject
# OWASP Top 10:2025 category IDs as Tags and clickable OWASP URLs into each
# rule's help markdown, then uploads the enriched SARIF to GitHub Advanced Security.
# Mapping source: .github/codeql/cwe-to-owasp-2025.json (160+ CWEs covered).
#
# ── Canary job ────────────────────────────────────────────────────────────────
# Set verify-canary: true when calling this workflow to run the SAST canary.
# The canary compiles and analyses latrobehealth/exp-sast-security-workflows/canary/
# (a self-contained project with one intentional vulnerability per OWASP class)
# and uploads the results to the calling repo's Security tab under the
# category "/language:csharp/sast-canary" so they are clearly distinguished
# from real findings.  The Python verification step then asserts every expected
# rule fired and writes a coverage table to the job summary.
#
# Cross-repo checkout requirement:
#   The verify-canary job checks out exp-sast-security-workflows from within the
#   calling repo's CI run.  Pass an org-level secret (contents:read on this repo)
#   as `canary-token`.  For organisations that grant "internal" visibility to all
#   members the default GITHUB_TOKEN is sufficient — omit canary-token in that case.
name: CodeQL (reusable)

on:
  workflow_call:
    inputs:
      languages:
        type: string
        required: true
        description: 'JSON array of CodeQL languages, e.g. ["csharp","javascript-typescript"]'
      build-mode:
        type: string
        default: "none"
        description: '"none" | "autobuild" | "manual"'
      runner:
        type: string
        default: "ubuntu-latest"
      query-suite:
        type: string
        default: "security-extended"
        description: 'CodeQL query suite identifier'
      verify-canary:
        type: boolean
        default: false
        description: 'Run the SAST canary to verify OWASP Top 10:2025 detection coverage'
      allure-project-name:
        type: string
        default: ''
        description: >
          Allure TestOps project name for the calling repo (e.g. exp-membership-service).
          Leave empty to skip Allure TestOps sync entirely.
    secrets:
      canary-token:
        required: false
        description: >
          PAT with contents:read on latrobehealth/exp-sast-security-workflows.
          Required only when the repo is private.  Omit for internal/public repos.
      ALLURE_TESTOPS_URL:
        required: false
        description: 'Allure TestOps base URL, e.g. https://allure.example.com'
      ALLURE_TESTOPS_API_TOKEN:
        required: false
        description: 'Allure TestOps API token for JWT token exchange'

permissions:
  contents: read
  security-events: write   # upload SARIF
  actions: read
  packages: read

jobs:
  # ── Primary scan — analyses the calling repository ──────────────────────────
  analyze:
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages:   ${{ matrix.language }}
          build-mode:  ${{ inputs.build-mode }}
          queries:     ${{ inputs.query-suite }}

      - name: Build (.NET — manual mode only)
        if: ${{ inputs.build-mode == 'manual' && matrix.language == 'csharp' }}
        run: dotnet build --configuration Release /p:UseSharedCompilation=false

      # Save SARIF locally so the enrichment step can annotate it before upload
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results

      # Checkout the security-workflow scripts repo so the enrichment script and
      # Allure sync script are available to this runner.  Done after CodeQL analyse
      # so the extra checkout does not affect the source snapshot already processed.
      - name: Checkout security workflow scripts
        uses: actions/checkout@v4
        with:
          repository: latrobehealth/exp-sast-security-workflows
          ref:        main
          path:       sast-security-scripts
          token:      ${{ secrets.canary-token || github.token }}

      # Inject OWASP Top 10:2025 category IDs into tags and add clickable OWASP
      # URLs to each rule's help markdown. Python 3 is pre-installed on ubuntu-latest.
      - name: Enrich SARIF with OWASP Top 10:2025
        run: python3 sast-security-scripts/.github/scripts/enrich-sarif-owasp.py sarif-results

      - name: Upload SARIF to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"

      # Sync application scan results to Allure TestOps.
      # Runs only for C# (where the OWASP test cases live) and only when
      # allure-project-name is set.  Never fails CI (continue-on-error).
      - name: Sync OWASP results to Allure TestOps
        if: ${{ inputs.allure-project-name != '' && matrix.language == 'csharp' }}
        continue-on-error: true
        env:
          ALLURE_TESTOPS_URL:       ${{ secrets.ALLURE_TESTOPS_URL }}
          ALLURE_TESTOPS_API_TOKEN: ${{ secrets.ALLURE_TESTOPS_API_TOKEN }}
        run: |
          if [ -z "$ALLURE_TESTOPS_URL" ] || [ -z "$ALLURE_TESTOPS_API_TOKEN" ]; then
            echo "ALLURE_TESTOPS_URL or ALLURE_TESTOPS_API_TOKEN not configured — skipping Allure sync"
            exit 0
          fi
          pip install requests --quiet
          python3 sast-security-scripts/scripts/allure-testops-sync.py \
            --sarif      sarif-results/csharp.sarif \
            --project    "${{ inputs.allure-project-name }}" \
            --version    "${{ github.ref_name }}" \
            --scan-type  application \
            --run-id     "${{ github.run_id }}" \
            --run-url    "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Canary scan — verifies OWASP Top 10:2025 detection coverage ─────────────
  #
  # Runs only when the caller sets verify-canary: true.
  # 1. Checks out exp-sast-security-workflows/canary/ — a self-contained project
  #    with one intentional vulnerability per OWASP class.
  # 2. Runs CodeQL and uploads results under category "sast-canary" so alerts
  #    are clearly distinguished from real findings on the Security tab.
  # 3. Runs verify-canary.py which asserts all expected rules fired and writes
  #    a coverage table to the GitHub Actions job summary.
  verify-canary:
    name: Verify OWASP Canary
    if: ${{ inputs.verify-canary == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout SAST canary code
        uses: actions/checkout@v4
        with:
          repository: latrobehealth/exp-sast-security-workflows
          ref:        main
          path:       sast-canary-src
          # canary-token: org PAT (contents:read) required for private repos;
          # safe to omit when exp-sast-security-workflows is internal/public.
          token: ${{ secrets.canary-token || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Initialize CodeQL (canary)
        uses: github/codeql-action/init@v3
        with:
          languages:   csharp
          queries:     ${{ inputs.query-suite }}
          source-root: sast-canary-src/canary

      - name: Build canary project
        run: dotnet build sast-canary-src/canary/Sast.Canary.csproj --configuration Release

      - name: Perform CodeQL Analysis (canary)
        uses: github/codeql-action/analyze@v3
        with:
          # Upload under a distinct category so canary alerts appear separately
          # from real findings in the Security → Code Scanning tab.
          # Filter by category "sast-canary" or path "sast-canary-src/**" to isolate them.
          category: "/language:csharp/sast-canary"
          output:   canary-sarif

      - name: Verify OWASP Top 10:2025 coverage
        run: python3 sast-canary-src/canary/scripts/verify-canary.py canary-sarif/csharp.sarif

      # Sync canary scan results to Allure TestOps (scanner-health project).
      # The canary always records to the exp-sast-security-workflows project so
      # scanner coverage history is kept separate from application security results.
      - name: Sync canary coverage to Allure TestOps
        if: ${{ inputs.allure-project-name != '' }}
        continue-on-error: true
        env:
          ALLURE_TESTOPS_URL:       ${{ secrets.ALLURE_TESTOPS_URL }}
          ALLURE_TESTOPS_API_TOKEN: ${{ secrets.ALLURE_TESTOPS_API_TOKEN }}
        run: |
          if [ -z "$ALLURE_TESTOPS_URL" ] || [ -z "$ALLURE_TESTOPS_API_TOKEN" ]; then
            echo "ALLURE_TESTOPS_URL or ALLURE_TESTOPS_API_TOKEN not configured — skipping canary Allure sync"
            exit 0
          fi
          pip install requests --quiet
          python3 sast-canary-src/scripts/allure-testops-sync.py \
            --sarif      canary-sarif/csharp.sarif \
            --project    "exp-sast-security-workflows" \
            --version    "${{ github.ref_name }}" \
            --scan-type  canary \
            --run-id     "${{ github.run_id }}" \
            --run-url    "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
